<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OnePlay Receiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
        
        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            background: linear-gradient(transparent 60%, rgba(0,0,0,0.8));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #overlay.visible { opacity: 1; }
        
        #title {
            color: #fff;
            font-size: 32px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        #subtitle {
            color: #ccc;
            font-size: 20px;
            font-family: Arial, sans-serif;
            margin-bottom: 16px;
        }
        
        #progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            margin-bottom: 12px;
        }
        
        #progress-fill {
            height: 100%;
            background: #e50914;
            border-radius: 2px;
            width: 0%;
            transition: width 0.5s;
        }
        
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #logo {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 28px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" autoplay playsinline></video>
    
    <div id="overlay">
        <div id="title"></div>
        <div id="subtitle"></div>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
    </div>
    
    <div id="status">
        <div class="spinner"></div>
        <div id="status-text">OnePlay</div>
    </div>
    
    <div id="logo">OnePlay</div>
</div>

<!-- HLS.js para streams HLS/TS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>

<!-- Cast Receiver SDK -->
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const progressFill = document.getElementById('progress-fill');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    
    let hls = null;
    let overlayTimer = null;
    
    // ─── Cast Framework Setup ───────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    
    // Interceptar carga de media
    playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        request => {
            const url = request.media.contentUrl;
            const contentType = request.media.contentType || '';
            const title = request.media.metadata?.title || 'OnePlay';
            const subtitle = request.media.metadata?.subtitle || '';
            
            console.log('📺 Loading media:', url);
            console.log('📦 Content-Type:', contentType);
            
            // Actualizar UI
            titleEl.textContent = title;
            subtitleEl.textContent = subtitle;
            showStatus('Cargando...');
            
            // Cargar con HLS.js
            loadMedia(url, contentType, request.currentTime || 0);
            
            // Rechazar el load del SDK nativo — nosotros manejamos el video
            return null;
        }
    );
    
    // Interceptar PLAY
    playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PLAY,
        request => {
            video.play();
            return null;
        }
    );
    
    // Interceptar PAUSE
    playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PAUSE,
        request => {
            video.pause();
            return null;
        }
    );
    
    // Interceptar SEEK
    playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.SEEK,
        request => {
            if (request.currentTime !== undefined) {
                video.currentTime = request.currentTime;
            }
            return null;
        }
    );
    
    // Interceptar STOP
    playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.STOP,
        request => {
            stopMedia();
            return null;
        }
    );
    
    // ─── Media Loading ───────────────────────────────────────
    function loadMedia(url, contentType, startTime) {
        // Destruir HLS anterior
        if (hls) {
            hls.destroy();
            hls = null;
        }
        
        const isHLS = contentType.includes('mpegurl') || 
                      contentType.includes('x-mpegurl') ||
                      url.includes('.m3u8');
        
        const isTS = contentType.includes('mp2t') || url.endsWith('.ts');
        
        console.log('🎬 isHLS:', isHLS, 'isTS:', isTS);
        
        if (isHLS || isTS) {
            // Usar HLS.js
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 30,
                    maxBufferLength: 60,
                    maxBufferSize: 60 * 1000 * 1000,
                    xhrSetup: function(xhr, url) {
                        // Permitir cualquier dominio HTTP
                    }
                });
                
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log('✅ Manifest parsed');
                    if (startTime > 0) {
                        video.currentTime = startTime;
                    }
                    video.play()
                        .then(() => {
                            hideStatus();
                            showOverlay();
                        })
                        .catch(err => console.error('Play error:', err));
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error('❌ HLS Error:', data.type, data.details);
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log('🔄 Network error, trying to recover...');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log('🔄 Media error, trying to recover...');
                                hls.recoverMediaError();
                                break;
                            default:
                                showStatus('Error al cargar el stream');
                                break;
                        }
                    }
                });
                
            } else {
                // Fallback nativo (Safari en Chromecast no aplica, pero por si acaso)
                video.src = url;
                video.load();
                video.play();
            }
        } else {
            // MP4, MKV, etc — reproducción directa
            video.src = url;
            if (startTime > 0) {
                video.addEventListener('loadedmetadata', () => {
                    video.currentTime = startTime;
                }, { once: true });
            }
            video.load();
            video.play()
                .then(() => { hideStatus(); showOverlay(); })
                .catch(err => console.error('Play error:', err));
        }
    }
    
    function stopMedia() {
        if (hls) { hls.destroy(); hls = null; }
        video.pause();
        video.src = '';
        showStatus('OnePlay');
    }
    
    // ─── Video Events ────────────────────────────────────────
    video.addEventListener('playing', () => {
        console.log('▶️ Playing');
        hideStatus();
        showOverlay();
        notifyState('PLAYING');
    });
    
    video.addEventListener('pause', () => {
        console.log('⏸ Paused');
        notifyState('PAUSED');
    });
    
    video.addEventListener('waiting', () => {
        console.log('⏳ Buffering');
        showStatus('Buffering...');
        notifyState('BUFFERING');
    });
    
    video.addEventListener('timeupdate', () => {
        if (video.duration && !isNaN(video.duration) && isFinite(video.duration)) {
            const pct = (video.currentTime / video.duration) * 100;
            progressFill.style.width = pct + '%';
        }
        notifyPosition();
    });
    
    video.addEventListener('error', (e) => {
        console.error('❌ Video error:', e);
        showStatus('Error de reproducción');
    });
    
    // ─── UI Helpers ──────────────────────────────────────────
    function showStatus(text) {
        statusText.textContent = text;
        statusEl.style.display = 'block';
    }
    
    function hideStatus() {
        statusEl.style.display = 'none';
    }
    
    function showOverlay() {
        overlay.classList.add('visible');
        clearTimeout(overlayTimer);
        overlayTimer = setTimeout(() => {
            overlay.classList.remove('visible');
        }, 4000);
    }
    
    // ─── Notify Cast SDK ─────────────────────────────────────
    function notifyState(state) {
        try {
            const customEvent = new cast.framework.events.MediaStatusEvent(
                cast.framework.events.EventType.PLAYER_STATE_CHANGED
            );
        } catch(e) {}
    }
    
    function notifyPosition() {
        // El SDK de Cast recoge la posición del video element automáticamente
    }
    
    // ─── Start Receiver ──────────────────────────────────────
    context.start({
        disableIdleTimeout: true
    });
    
    console.log('🎬 OnePlay Receiver started');
</script>

</body>
</html>
